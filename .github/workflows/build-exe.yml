name: Build and Release Windows EXE

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: '对应Release tag名字(例:1.4.2)'
        required: true
        default: ''

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm' # or 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Build Native Image with Maven
        run: |
          # Execute maven native compilation
          # Ensure this runs in the Developer Command Prompt environment
          cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && rc /nologo /fo app.res app.rc && mvn clean -Pnative native:compile -DskipTests -Dnative.maven.plugin.version=0.9.28"

      - name: Set Version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $TAG_NAME = "${{ github.event.release.tag_name }}"
          } else {
            $TAG_NAME = "${{ github.event.inputs.tag_name }}"
          }
          # Remove 'v' prefix if it exists
          $VERSION = $TAG_NAME -replace "^v", ""
          echo "tag=$TAG_NAME" >> $env:GITHUB_OUTPUT
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "Version: $VERSION, Tag: $TAG_NAME"

      - name: Rename Executable
        run: |
          $TAG_NAME = "${{ steps.version.outputs.tag }}"
          if (Test-Path "target\biliupforjava.exe") {
            Rename-Item -Path "target\biliupforjava.exe" -NewName "biliupforjava-${TAG_NAME}.exe"
            Write-Host "Renamed target\biliupforjava.exe to biliupforjava-${TAG_NAME}.exe"
          } else {
            Write-Error "target\biliupforjava.exe not found!"
            exit 1
          }

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG_NAME = "${{ steps.version.outputs.tag }}"
          $ARTIFACT = "target\biliupforjava-${TAG_NAME}.exe"
          
          if (-Not (Test-Path $ARTIFACT)) {
            Write-Error "ERROR: Expected EXE file not found: $ARTIFACT"
            exit 1
          }
          
          Write-Host "Uploading release asset: $ARTIFACT to tag: $TAG_NAME"
          gh release upload $TAG_NAME $ARTIFACT --clobber
