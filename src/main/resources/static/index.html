<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="录播姬上传插件 - 自动化直播录制上传解决方案">
    <meta name="theme-color" content="#5b6cff">
    <link rel="icon" href="img/icon.svg" type="image/svg+xml">
    <title>录播姬上传插件</title>
    <link href="css/element-ui.css" rel="stylesheet">
    <link href="css/index.css" rel="stylesheet">
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/vue.min.js"></script>
    <script src="js/element-ui.js"></script>
    <script src="js/index.js"></script>
</head>
<body>
<div id="app" class="app-container">
    <!-- 顶部导航栏 -->
    <header class="app-header">
        <div class="header-brand">
            <img src="img/icon.svg" alt="Logo" class="brand-logo">
            <div class="brand-info">
                <h1 class="brand-title">录播姬上传插件</h1>
                <span class="brand-version">v1.4.1-beta5</span>
            </div>
        </div>
        <nav class="header-nav">
            <div class="nav-item" 
                 :class="{ 'is-active': activeName === 'home' }" 
                 @click="activeName = 'home'">
                <i class="el-icon-document"></i>
                <span>更新日志</span>
            </div>
            <div class="nav-item" 
                 :class="{ 'is-active': activeName === 'room' }" 
                 @click="activeName = 'room'; handleClick()">
                <i class="el-icon-video-camera"></i>
                <span>直播间</span>
            </div>
            <div class="nav-item" 
                 :class="{ 'is-active': activeName === 'user' }" 
                 @click="activeName = 'user'; handleClick()">
                <i class="el-icon-user"></i>
                <span>用户</span>
            </div>
            <div class="nav-item" 
                 :class="{ 'is-active': activeName === 'history' }" 
                 @click="activeName = 'history'; handleClick()">
                <i class="el-icon-time"></i>
                <span>录制历史</span>
            </div>
            <div class="nav-item" 
                 :class="{ 'is-active': activeName === 'log', 'has-alert': hasAlerts }" 
                 @click="activeName = 'log'; handleClick()">
                <i class="el-icon-monitor"></i>
                <span>日志</span>
                <span v-if="hasAlerts" class="alert-badge"></span>
            </div>
            
            <!-- 主题切换按钮 -->
            <div class="theme-toggle" @click="toggleTheme" title="切换主题">
                <i :class="theme === 'dark' ? 'el-icon-sunny' : 'el-icon-moon'"></i>
            </div>
        </nav>
    </header>
    
    <!-- 主内容区域 -->
    <main class="app-main">
        <transition name="fade-slide" mode="out-in">
            <!-- 更新日志页面 -->
            <div v-if="activeName === 'home'" class="changelog-container" key="home">
                <div class="changelog-header">
                    <div class="changelog-title">
                        <i class="el-icon-document"></i>
                        <h2>更新日志</h2>
                    </div>
                    <div class="changelog-stats">
                        <span class="stat-item">
                            <span class="stat-value">{{ versions.length }}</span>
                            <span class="stat-label">版本更新</span>
                        </span>
                    </div>
                </div>
                
                <div class="version-timeline">
                    <div v-for="(version, idx) in sortedVersions" 
                         :key="version.version + '-' + version.time" 
                         class="version-card"
                         :class="{ 'is-latest': idx === 0 }">
                        <div class="version-marker">
                            <div class="marker-dot"></div>
                            <div class="marker-line" v-if="idx < sortedVersions.length - 1"></div>
                        </div>
                        <div class="version-content-wrapper">
                            <div class="version-badge" :class="{ 'is-latest': idx === 0 }">
                                v{{ version.version }}
                            </div>
                            <div class="version-date">
                                <i class="el-icon-calendar"></i>
                                {{ version.time }}
                            </div>
                            <div class="version-text">{{ version.content }}</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- iframe 子页面 -->
            <iframe v-else :src="tabSrc" class="tab-frame" frameborder="0" :key="activeName"></iframe>
        </transition>
    </main>
</div>
</body>
<script>
    let answer = new Vue({
        el: '#app',
        data: {
            activeName: 'home',
            theme: localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
            hasAlerts: false,
            versions: [
                { time: '2025-12-21', version: '1.4.1-beta5', content: '优化Webhook推送处理，响应更快更稳定；历史记录查询新增加载提示并防重复点击；修复部分历史记录结束后仍显示录制中的异常。' },
                { time: '2025-12-16', version: '1.4.1-beta4.9', content: '一键并发检测所有线路状态，并在下拉菜单中通过颜色（绿/黄/红）和延迟数值（ms）实时展示线路健康状况；在基础检测通过后，可对可用线路进行真实的上传速度测试，并显示具体速度。' },
                { time: '2025-12-15', version: '1.4.1-beta4.8', content: '录制历史详情页新增“刷新状态”按钮，支持手动同步稿件最新状态；优化视频状态检测逻辑，游客接口遇-404时不报警告并自动切换至创作中心API，完善“仅自己可见”稿件的识别支持。' },
                { time: '2025-12-15', version: '1.4.1-beta4.7', content: '界面优化：主页导航栏重构、更新日志时间线布局、录制历史筛选面板优化、直播间/用户页面新增统计信息和空状态提示、登录二维码状态实时显示；修复时间戳跳变错误无限重试问题，改为直接放弃该投稿。' },
                { time: '2025-12-14', version: '1.4.1-beta4.6', content: '新增验证码控制台脚本方案及Debug信息；新增上传线路错误(500/504)自动暂停机制；请求增加限流保护（投稿/上传/同步/刷新）；优化评论发送；优化异常提醒界面支持长日志查看与复制；录制历史新增房间号列。' },
                { time: '2025-12-11', version: '1.4.1-beta4.4', content: '优化弹幕发送逻辑，自动忽略仅自己可见稿件。' },
                { time: '2025-12-11', version: '1.4.1-beta4.3', content: '紧急修复编辑稿件可见性问题，并将工作流程增加日志提示以及操作延迟；修复评论发送逻辑，避免无评论时重复检查' },
                { time: '2025-12-11', version: '1.4.1-beta4.2', content: '修复404无限循环问题（增加Member API二次确认）；修复文件管理模块日志等级错误（成功操作不再标记为ERROR）；优化日志信息（增加BVID/标题显示，弹幕超时降级为WARN）。' },
                { time: '2025-12-11', version: '1.4.1-beta4.1', content: '支持“仅自己可见”稿件视为发布成功并自动执行后续操作（发评论/弹幕/文件处理）；优化评论区SC和上舰信息格式；优化历史记录查询性能。' },
                { time: '2025-12-11', version: '1.4.1-beta4', content: '新增视频投稿状态同步（支持审核中、转码中等状态识别）；新增直播间状态主动查询兜底机制；优化界面卡片颜色指示；修复被退回稿件导致无限查询等问题。' },
                { time: '2025-12-09', version: '1.4.1-beta3-alpha10', content: '新增日志功能，方便直接网页直接看错误信息。' },
                { time: '2025-12-09', version: '1.4.1-beta3', content: '主页美化。' },
                { time: '2025-09-15', version: '1.4.1', content: '修复高能片段弹幕太少导致生成错误，逻辑微调。' },
                { time: '2025-08-15', version: '1.4.0', content: '新增高能片段自动剪辑投稿功能。' },
                { time: '2025-07-17', version: '1.3.3', content: '修复转载稿件缺少转载源无法投稿问题。' },
                { time: '2025-07-17', version: '1.3.2', content: '移除客户端接口，修复封面上传失败问题。' },
                { time: '2025-04-27', version: '1.3.1', content: '修复需要验证码也认为投稿成功的情况。' },
                { time: '2025-02-23', version: '1.3.0', content: '支持仅自己可见，支持加入合集，需要重新创建数据库文件。' },
                { time: '2024-11-26', version: '1.2.8', content: '修复web投稿接口因为风控无法投稿的问题。' },
                { time: '2024-11-21', version: '1.2.7', content: '修复视频aid太长导致重新提交失败的问题。' },
                { time: '2024-10-31', version: '1.2.6', content: '修复一级账号无法分p投稿的问题。' },
                { time: '2024-10-30', version: '1.2.5', content: '修复配置文件过大无法导入的问题。' },
                { time: '2024-10-25', version: '1.2.4', content: '投稿描述模板支持${@uid}。' },
                { time: '2024-09-05', version: '1.2.3', content: '更新上传线路。' },
                { time: '2024-07-23', version: '1.2.2', content: '修复blrec弹幕金额异常问题，投稿分p变量添加fileName。' },
                { time: '2024-05-17', version: '1.2.1', content: '修复直播间标题存在}时无法正常投稿的问题。' },
                { time: '2024-01-29', version: '1.2.0', content: '修复.cover.png直播封面无法使用的问题。' },
                { time: '2024-01-08', version: '1.1.9', content: '修复同一场直播错误切分成多次投稿的问题。' },
                { time: '2024-01-07', version: '1.1.8', content: '修复录制结束后并没有成功结束录制状态的问题。' },
                { time: '2023-12-27', version: '1.1.7', content: '修复workPath不支持输入\\\\符号需要更换为/的问题。' },
                { time: '2023-12-25', version: '1.1.6', content: '使用undertow替换tomcat。' },
                { time: '2023-12-12', version: '1.1.5', content: '修复可能发生的分p标题时间错误问题。' },
                { time: '2023-12-07', version: '1.1.4', content: '转码失败支持检测时间戳跳变原因。' },
                { time: '2023-11-27', version: '1.1.3', content: '增加blrec开启封装后文件丢失重新上传功能。' },
                { time: '2023-11-27', version: '1.1.2', content: '修复刚刚创建的录制历史不存在结束时间的问题，blrec后处理的文件类型更新到数据库。' },
                { time: '2023-11-27', version: '1.1.1', content: '修复可能发生的多次间隔十分钟以上的直播合并到同一个历史里的问题。' },
                { time: '2023-11-08', version: '1.1.0', content: '修复标题模板变量为空时空指针报错问题。' },
                { time: '2023-11-05', version: '1.0.9', content: '优化登录流程。' },
                { time: '2023-10-26', version: '1.0.8', content: '修复blrec封面无法正常使用的问题。' },
                { time: '2023-10-21', version: '1.0.7', content: '修复分p标题title变量错误的问题。' },
                { time: '2023-10-20', version: '1.0.6', content: '修复工作目录设置路径里/\\\\的问题。' },
                { time: '2023-10-20', version: '1.0.5', content: '对于找不到视频文件进行日志提示和处理优化。' },
                { time: '2023-10-19', version: '1.0.4', content: '分p参数支持title变量。' },
                { time: '2023-10-09', version: '1.0.3', content: '修复blrec没有文件大小和时间的问题。' },
                { time: '2023-10-08', version: '1.0.2', content: '修复可能会自动创建两个相同房间的问题。' },
                { time: '2023-10-07', version: '1.0.1', content: '支持blrec，简单支持，测试版本。' }
            ]
        },
        computed: {
            sortedVersions: function () {
                return this.versions.slice().sort(function (a, b) {
                    return new Date(b.time) - new Date(a.time);
                });
            },
            tabSrc: function () {
                switch (this.activeName) {
                    case 'room':
                        return 'html/room.html';
                    case 'user':
                        return 'html/user.html';
                    case 'history':
                        return 'html/history.html';
                    case 'log':
                        return 'html/log.html';
                    default:
                        return '';
                }
            }
        },
        mounted: function() {
            this.applyTheme(this.theme);
            this.checkAlerts();
            setInterval(this.checkAlerts, 30000);
        },
        methods: {
            checkAlerts: function() {
                fetch('/log/alerts')
                    .then(res => res.json())
                    .then(data => {
                        this.hasAlerts = data && data.length > 0;
                    })
                    .catch(e => console.error(e));
            },
            toggleTheme: function() {
                this.theme = this.theme === 'dark' ? 'light' : 'dark';
                this.applyTheme(this.theme);
            },
            applyTheme: function(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                var iframe = document.querySelector('iframe');
                if (iframe && iframe.contentDocument) {
                    iframe.contentDocument.documentElement.setAttribute('data-theme', theme);
                }
            },
            handleClick: function () {
                // Navigate to tab content
            }
        }
    });
</script>
</html>
