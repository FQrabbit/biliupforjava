<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="录播姬上传插件 - 自动化直播录制上传解决方案">
    <meta name="theme-color" content="#5b6cff">
    <link rel="icon" href="img/icon.svg" type="image/svg+xml">
    <title>录播姬上传插件</title>
    <link href="css/element-ui.css" rel="stylesheet">
    <link href="css/index.css" rel="stylesheet">
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/vue.min.js"></script>
    <script src="js/element-ui.js"></script>
    <script src="js/index.js"></script>
</head>
<body>
<div id="app" class="app-container">
    <!-- 顶部导航栏 -->
    <header class="app-header">
        <div class="header-brand">
            <img src="img/icon.svg" alt="Logo" class="brand-logo">
            <div class="brand-info">
                <h1 class="brand-title">录播姬上传插件</h1>
                <a v-if="hasNewVersion" 
                   :href="releaseUrl" 
                   target="_blank" 
                   class="brand-version link-type"
                   title="发现新版本，点击查看">
                    {{ currentVersion }}
                    <span class="new-badge">NEW</span>
                </a>
                <span v-else class="brand-version">{{ currentVersion }}</span>
            </div>
        </div>
        <nav class="header-nav">
            <div class="nav-item" 
                 :class="{ 'is-active': activeName === 'home' }" 
                 @click="activeName = 'home'">
                <i class="el-icon-document"></i>
                <span>更新日志</span>
            </div>
            <div class="nav-item" 
                 :class="{ 'is-active': activeName === 'room' }" 
                 @click="activeName = 'room'; handleClick()">
                <i class="el-icon-video-camera"></i>
                <span>直播间</span>
            </div>
            <div class="nav-item" 
                 :class="{ 'is-active': activeName === 'user' }" 
                 @click="activeName = 'user'; handleClick()">
                <i class="el-icon-user"></i>
                <span>用户</span>
            </div>
            <div class="nav-item" 
                 :class="{ 'is-active': activeName === 'history' }" 
                 @click="activeName = 'history'; handleClick()">
                <i class="el-icon-time"></i>
                <span>录制历史</span>
            </div>
            <div class="nav-item" 
                 :class="{ 'is-active': activeName === 'log', 'has-alert': hasAlerts }" 
                 @click="activeName = 'log'; handleClick()">
                <i class="el-icon-monitor"></i>
                <span>日志</span>
                <span v-if="hasAlerts" class="alert-badge"></span>
            </div>
            
            <!-- 主题切换按钮 -->
            <div class="theme-toggle" @click="toggleTheme" title="切换主题">
                <i :class="theme === 'dark' ? 'el-icon-sunny' : 'el-icon-moon'"></i>
            </div>
        </nav>
    </header>
    
    <!-- 主内容区域 -->
    <main class="app-main">
        <transition name="fade-slide" mode="out-in">
            <!-- 更新日志页面 -->
            <div v-if="activeName === 'home'" class="changelog-container" key="home">
                <!-- 系统配置面板 -->
                <div class="config-panel" :class="{ 'is-expanded': configExpanded }">
                    <div class="config-header" @click="configExpanded = !configExpanded">
                        <div class="config-title">
                            <i class="el-icon-setting"></i>
                            <span>系统配置</span>
                            <el-badge v-if="hasConfigChanges" is-dot class="config-badge"></el-badge>
                        </div>
                        <div class="config-actions">
                            <el-button v-if="hasConfigChanges" type="text" size="mini" @click.stop="resetConfig" class="reset-btn">
                                <i class="el-icon-refresh-left"></i> 重置
                            </el-button>
                            <i :class="configExpanded ? 'el-icon-arrow-up' : 'el-icon-arrow-down'" class="expand-icon"></i>
                        </div>
                    </div>
                    
                    <transition name="filter-slide">
                        <div class="config-body" v-show="configExpanded">
                            <div class="config-grid">
                                <div class="config-item">
                                    <label class="config-label">
                                        <i class="el-icon-s-promotion"></i>
                                        API请求限速
                                        <span class="config-unit">QPS</span>
                                    </label>
                                    <el-input 
                                        v-model="systemConfig.apiQps" 
                                        @input="validateNumber($event, 'apiQps', true)" 
                                        placeholder="请输入数字" 
                                        size="small"
                                        class="config-input">
                                    </el-input>
                                    <div class="config-help">限制每秒请求B站API的次数，防止风控。系统本身已对各项请求增加合理延迟，此配置为全局限制以防意外频繁请求，无需设置过低。</div>
                                </div>
                                
                                <div class="config-item">
                                    <label class="config-label">
                                        <i class="el-icon-upload"></i>
                                        上传带宽限速
                                        <span class="config-unit">MB/s</span>
                                    </label>
                                    <el-input 
                                        v-model="systemConfig.uploadMb" 
                                        @input="validateNumber($event, 'uploadMb', false)" 
                                        placeholder="请输入数字" 
                                        size="small"
                                        class="config-input">
                                    </el-input>
                                    <div class="config-help">限制上传视频时的最大带宽，0为不限速</div>
                                </div>
                            </div>
                            
                            <div class="config-footer">
                                <el-button class="modern-btn" type="primary" @click="saveSystemConfig" :loading="configLoading" icon="el-icon-check" size="small">
                                    保存配置
                                </el-button>
                            </div>
                        </div>
                    </transition>
                </div>

                <div class="changelog-header">
                    <div class="changelog-title">
                        <i class="el-icon-document"></i>
                        <h2>更新日志</h2>
                    </div>
                    <div class="changelog-stats">
                        <span class="stat-item">
                            <span class="stat-value">{{ versions.length }}</span>
                            <span class="stat-label">版本更新</span>
                        </span>
                    </div>
                </div>
                
                <div class="version-timeline">
                    <div v-for="(version, versionIndex) in sortedVersions" 
                         :key="version.version + '-' + version.time" 
                         class="version-card"
                         :class="{ 'is-latest': versionIndex === 0 }">
                        <div class="version-marker">
                            <div class="marker-dot"></div>
                            <div class="marker-line" v-if="versionIndex < sortedVersions.length - 1"></div>
                        </div>
                        <div class="version-content-wrapper">
                            <div class="version-badge" :class="{ 'is-latest': versionIndex === 0 }">
                                v{{ version.version }}
                            </div>
                            <div class="version-date">
                                <i class="el-icon-calendar"></i>
                                {{ version.time }}
                            </div>
                            <div class="version-text">{{ version.content }}</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- iframe 子页面 -->
            <iframe v-else :src="tabSrc" class="tab-frame" frameborder="0" :key="activeName"></iframe>
        </transition>
    </main>
</div>
</body>

        computed: {
            sortedVersions: function () {
                return this.versions.slice().sort(function (a, b) {
                    return new Date(b.time) - new Date(a.time);
                });
            },
            tabSrc: function () {
                switch (this.activeName) {
                    case 'room':
                        return 'html/room.html';
                    case 'user':
                        return 'html/user.html';
                    case 'history':
                        return 'html/history.html';
                    case 'log':
                        return 'html/log.html';
                    default:
                        return '';
                }
            }
        },
        mounted: function() {
            this.applyTheme(this.theme);
            this.checkAlerts();
            this.loadSystemConfig();
            setInterval(this.checkAlerts, 30000);
            this.checkUpdate();
        },
        methods: {
            validateNumber: function(value, field, allowDecimal) {
                // 验证输入是否为数字
                var self = this;
                var cleanValue = value.replace(/[^0-9.]/g, '');
                
                // 如果允许小数，确保只有一个小数点
                if (allowDecimal) {
                    var parts = cleanValue.split('.');
                    if (parts.length > 2) {
                        cleanValue = parts[0] + '.' + parts.slice(1).join('');
                    }
                } else {
                    // 不允许小数，移除所有小数点
                    cleanValue = cleanValue.replace(/\./g, '');
                }
                
                // 更新数据
                self.systemConfig[field] = cleanValue;
                
                // 检查是否有更改
                self.checkConfigChanges();
            },
            checkConfigChanges: function() {
                // 检查配置是否有更改
                var self = this;
                var originalApiQps = parseFloat(self.originalConfig.apiQps) || 0;
                var originalUploadMb = parseFloat(self.originalConfig.uploadMb) || 0;
                var currentApiQps = parseFloat(self.systemConfig.apiQps) || 0;
                var currentUploadMb = parseFloat(self.systemConfig.uploadMb) || 0;
                
                self.hasConfigChanges = (originalApiQps !== currentApiQps) || (originalUploadMb !== currentUploadMb);
            },
            resetConfig: function() {
                // 重置配置
                var self = this;
                self.systemConfig.apiQps = self.originalConfig.apiQps;
                self.systemConfig.uploadMb = self.originalConfig.uploadMb;
                self.hasConfigChanges = false;
            },
            loadSystemConfig: function() {
                var self = this;
                $.ajax({
                    url: '/system-config/list',
                    type: 'GET',
                    success: function(data) {
                        if (data && data.length > 0) {
                            data.forEach(function(item) {
                                if (item.configKey === 'bili.limit.api-qps') {
                                    self.systemConfig.apiQps = parseFloat(item.configValue);
                                } else if (item.configKey === 'bili.limit.upload-mb') {
                                    self.systemConfig.uploadMb = parseFloat(item.configValue);
                                }
                            });
                        }
                        // 保存原始配置用于重置
                        self.originalConfig = {
                            apiQps: self.systemConfig.apiQps,
                            uploadMb: self.systemConfig.uploadMb
                        };
                    },
                    error: function(e) {
                        console.error('Failed to load system config', e);
                    }
                });
            },
            saveSystemConfig: function() {
                var self = this;
                this.configLoading = true;
                
                // 确保值为有效的数字
                var apiQps = parseFloat(self.systemConfig.apiQps) || 0;
                var uploadMb = parseInt(self.systemConfig.uploadMb) || 0;
                
                var updates = [
                    { key: 'bili.limit.api-qps', value: String(apiQps) },
                    { key: 'bili.limit.upload-mb', value: String(uploadMb) }
                ];
                
                var promises = updates.map(function(item) {
                    return new Promise(function(resolve, reject) {
                        $.ajax({
                            url: '/system-config/update',
                            type: 'POST',
                            contentType: 'application/json',
                            data: JSON.stringify(item),
                            success: resolve,
                            error: reject
                        });
                    });
                });

                Promise.all(promises).then(function() {
                    // 保存成功后更新原始配置
                    self.originalConfig = {
                        apiQps: self.systemConfig.apiQps,
                        uploadMb: self.systemConfig.uploadMb
                    };
                    self.hasConfigChanges = false;
                    self.$message.success('系统配置已保存并生效');
                }).catch(function() {
                    self.$message.error('保存配置失败');
                }).finally(function() {
                    self.configLoading = false;
                });
            },
            checkUpdate: function() {
                var self = this;
                var CACHE_KEY = 'biliup_update_cache';
                var CACHE_DURATION = 3600 * 1000; // 1 hour

                var processData = function(data) {
                    if (data && data.length > 0 && data[0].tag_name) {
                        var newVer = data[0].tag_name;
                        var v1 = self.currentVersion.replace(/^v/, '');
                        var v2 = newVer.replace(/^v/, '');
                        
                        if (v1 !== v2 && self.compareVersions(v1, v2) < 0) {
                            self.hasNewVersion = true;
                            self.releaseUrl = data[0].html_url;
                        }
                    }
                };

                // 先尝试缓存
                try {
                    var cache = JSON.parse(localStorage.getItem(CACHE_KEY));
                    if (cache && (Date.now() - cache.timestamp < CACHE_DURATION)) {
                        console.log('[Update] 使用缓存信息');
                        processData(cache.data);
                        return;
                    }
                } catch (e) { console.error(e); }

                // 从API获取版本
                $.ajax({
                    url: 'https://api.github.com/repos/FQrabbit/biliupforjava/releases?per_page=1',
                    type: 'GET',
                    timeout: 5000,
                    success: function(data) {
                        localStorage.setItem(CACHE_KEY, JSON.stringify({
                            timestamp: Date.now(),
                            data: data
                        }));
                        processData(data);
                    },
                    error: function(xhr) {
                        console.warn('[Update] 检查失败:', xhr.status);
                        // 如果可用，尝试使用过期的缓存
                        try {
                            var cache = JSON.parse(localStorage.getItem(CACHE_KEY));
                            if (cache && cache.data) {
                                console.log('[Update] 使用过时缓存回退');
                                processData(cache.data);
                            }
                        } catch (e) {}
                    }
                });
            },
            compareVersions: function(v1, v2) {
                var tokenize = function(v) {
                    return v.split(/([0-9]+)/).filter(function(s){ return s && s.length > 0; });
                };
                
                var parts1 = v1.split(/[-.]/);
                var parts2 = v2.split(/[-.]/);
                
                var len = Math.max(parts1.length, parts2.length);
                for (var i = 0; i < len; i++) {
                    var p1 = parts1[i];
                    var p2 = parts2[i];
                    
                    if (p1 === p2) continue;
                    if (p1 === undefined) return /^\d/.test(p2) ? -1 : 1;
                    if (p2 === undefined) return /^\d/.test(p1) ? 1 : -1;
                    
                    var t1 = tokenize(p1);
                    var t2 = tokenize(p2);
                    
                    for (var j = 0; j < Math.max(t1.length, t2.length); j++) {
                        var sub1 = t1[j];
                        var sub2 = t2[j];
                        
                        if (sub1 === sub2) continue;
                        if (sub1 === undefined) return -1;
                        if (sub2 === undefined) return 1;
                        
                        var n1 = parseInt(sub1);
                        var n2 = parseInt(sub2);
                        
                        if (!isNaN(n1) && !isNaN(n2)) {
                            if (n1 !== n2) return n1 - n2;
                        } else {
                            if (sub1 < sub2) return -1;
                            if (sub1 > sub2) return 1;
                        }
                    }
                }
                return 0;
            },
            checkAlerts: function() {
                fetch('/log/alerts')
                    .then(res => res.json())
                    .then(data => {
                        this.hasAlerts = data && data.length > 0;
                    })
                    .catch(e => console.error(e));
            },
            toggleTheme: function() {
                this.theme = this.theme === 'dark' ? 'light' : 'dark';
                this.applyTheme(this.theme);
            },
            applyTheme: function(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                var iframe = document.querySelector('iframe');
                if (iframe && iframe.contentDocument) {
                    iframe.contentDocument.documentElement.setAttribute('data-theme', theme);
                }
            },
            handleClick: function () {
                // Navigate to tab content
            }
        }
    });
</script>
