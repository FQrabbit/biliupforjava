<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志控制台</title>
    <link rel="icon" href="../img/icon.svg" type="image/svg+xml">
    <link href="../css/element-ui.css" rel="stylesheet">
    <link href="../css/index.css" rel="stylesheet">
    <link href="../css/log.css" rel="stylesheet">
    <script src="../js/jquery-3.3.1.min.js"></script>
    <script src="../js/vue.min.js"></script>
    <script src="../js/element-ui.js"></script>
    <script src="../js/index.js"></script>
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
<div id="app" class="app-container log-page">
    <el-container class="log-layout">
        <el-header class="log-header" height="auto">
            <el-card shadow="never" class="log-toolbar-card">
                <div class="log-toolbar-head">
                    <div class="log-title">日志控制台</div>
                    <div class="log-meta">
                        <el-tag size="mini" :type="statusTagType" effect="dark">{{ statusText }}</el-tag>
                    </div>
                </div>
                <el-row :gutter="10" class="toolbar-row">
                    <el-col :xs="24" :sm="12" :md="8" :lg="6">
                        <el-button-group style="width: 100%; display: flex;">
                            <el-button size="small" type="danger" @click="clearLogs" style="flex: 1;">清空</el-button>
                            <el-button size="small" type="warning" icon="el-icon-warning" v-if="alerts.length > 0" @click="showAlerts = true" style="flex: 1;">
                                异常({{ alerts.length }})
                            </el-button>
                        </el-button-group>
                    </el-col>
                    
                    <el-col :xs="24" :sm="12" :md="8" :lg="6">
                        <el-select v-model="visibleLevels" multiple collapse-tags placeholder="日志等级" size="small" style="width: 100%;" class="log-level-select" popper-class="log-level-popper">
                            <el-option label="INFO" value="INFO">
                                <span class="log-level-option">
                                    <span class="log-level-dot level-INFO"></span>
                                    <span class="log-level-text level-INFO">INFO</span>
                                </span>
                            </el-option>
                            <el-option label="WARN" value="WARN">
                                <span class="log-level-option">
                                    <span class="log-level-dot level-WARN"></span>
                                    <span class="log-level-text level-WARN">WARN</span>
                                </span>
                            </el-option>
                            <el-option label="ERROR" value="ERROR">
                                <span class="log-level-option">
                                    <span class="log-level-dot level-ERROR"></span>
                                    <span class="log-level-text level-ERROR">ERROR</span>
                                </span>
                            </el-option>
                            <el-option label="DEBUG" value="DEBUG">
                                <span class="log-level-option">
                                    <span class="log-level-dot level-DEBUG"></span>
                                    <span class="log-level-text level-DEBUG">DEBUG</span>
                                </span>
                            </el-option>
                        </el-select>
                    </el-col>

                    <el-col :xs="24" :sm="24" :md="8" :lg="12">
                        <div class="log-switches">
                            <el-tooltip effect="dark" placement="top" content="开启后会加载/保留更多日志（最多2000行）；关闭时仅保留较少日志（默认500行），保证浏览器更流畅。">
                                <span>
                                    <el-switch v-model="detailedMode" active-text="详细模式" @change="handleDetailedModeChange"></el-switch>
                                </span>
                            </el-tooltip>

                            <el-tooltip effect="dark" placement="top" content="开启后点击日志行可多选，并自动把已选日志复制到剪贴板。">
                                <span>
                                    <el-switch v-model="selectionMode" active-text="多选模式" @change="handleSelectionModeChange"></el-switch>
                                </span>
                            </el-tooltip>

                            <el-tooltip effect="dark" placement="top" content="开启后日志会自动换行；关闭后单行不换行，便于对齐查看。">
                                <span>
                                    <el-switch v-model="autoWrap" active-text="自动换行"></el-switch>
                                </span>
                            </el-tooltip>

                            <el-tooltip effect="dark" placement="top" content="开启后新日志到来会自动滚动到底部；关闭后保持当前位置不动。">
                                <span>
                                    <el-switch v-model="autoScroll" active-text="自动滚动"></el-switch>
                                </span>
                            </el-tooltip>

                            <el-tooltip effect="dark" placement="top" content="开启后通过 WebSocket 实时接收日志；关闭后暂停实时推送（可继续查看已加载内容）。">
                                <span>
                                    <el-switch v-model="realtime" active-text="实时推送" @change="toggleRealtime"></el-switch>
                                </span>
                            </el-tooltip>

                            <el-tooltip effect="dark" placement="top" content="开启后将日志中的 BV 号、文件路径、标题/房间名/主播名等敏感信息显示为 ***，便于截图分享。">
                                <span>
                                    <el-switch v-model="privacyMode" active-text="隐私模式"></el-switch>
                                </span>
                            </el-tooltip>
                        </div>
                    </el-col>
                </el-row>
            </el-card>
        </el-header>

        <el-main class="log-content">
            <div class="log-console" ref="console">
                <div v-for="(log, index) in filteredLogs" :key="log.__id" 
                     class="log-line" 
                     :class="{ 'nowrap': !autoWrap, 'selection-mode': selectionMode, 'selected': isSelected(log) }"
                     :data-log-id="log.__id"
                     @click="handleLogClick(log)">
                    <span class="log-time">{{ log.timestamp }}</span>
                    <span class="log-level" :class="'level-' + log.level">{{ log.level }}</span>
                    <span class="log-thread" v-if="log.thread">[{{ log.thread }}]</span>
                    <span class="log-message" v-html="formatLogMessage(log.message)"></span>
                </div>
            </div>
        </el-main>
    </el-container>

    <el-dialog title="系统异常提醒" :visible.sync="showAlerts" width="90%" :fullscreen="isMobile">
        <el-alert
            title="这些异常是在您离线期间或最近发生的，请检查。"
            type="warning"
            :closable="false"
            style="margin-bottom: 10px;">
        </el-alert>
        <el-table :data="alerts" stripe style="width: 100%" height="300">
            <el-table-column prop="timestamp" label="时间" width="160">
                <template slot-scope="scope">{{ formatDate(scope.row.timestamp) }}</template>
            </el-table-column>
            <el-table-column prop="type" label="类型" width="120">
                <template slot-scope="scope">
                    <el-tag :type="getAlertType(scope.row.type)" size="mini">{{ scope.row.type }}</el-tag>
                </template>
            </el-table-column>
            <el-table-column label="详情" min-width="300">
                <template slot-scope="scope">
                    <div style="display: flex; align-items: flex-start;">
                        <div style="flex: 1; max-height: 46px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; word-break: break-all; margin-right: 8px; font-size: 12px; color: #606266;">
                            {{ maskLogLine(scope.row.message) }}
                        </div>
                        <el-button size="mini" type="text" @click="showDetail(scope.row.message)" style="padding: 0;">详情</el-button>
                    </div>
                </template>
            </el-table-column>
        </el-table>
        <span slot="footer" class="dialog-footer">
            <el-button type="danger" @click="clearAlerts">清除所有</el-button>
            <el-button @click="showAlerts = false">关 闭</el-button>
        </span>
    </el-dialog>

    <!-- 详情弹窗 -->
    <el-dialog title="异常详情" :visible.sync="detailDialogVisible" width="80%" append-to-body>
        <div style="background-color: #f5f7fa; padding: 15px; border-radius: 4px; max-height: 60vh; overflow-y: auto;">
            <pre style="margin: 0; white-space: pre-wrap; word-wrap: break-word; font-family: Consolas, Monaco, monospace; font-size: 12px;">{{ maskLogLine(currentDetail) }}</pre>
        </div>
        <span slot="footer" class="dialog-footer">
            <el-button type="primary" size="small" @click="copyDetail">复制内容</el-button>
            <el-button size="small" @click="detailDialogVisible = false">关 闭</el-button>
        </span>
    </el-dialog>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            logs: [],
            visibleLevels: ['INFO', 'WARN', 'ERROR'],
            autoWrap: true,
            autoScroll: true,
            realtime: true,
            detailedMode: false,
            maxLogsLite: 500,
            maxLogsDetailed: 2000,
            selectionMode: false,
            selectedLogs: new Set(),
            loadingHistory: false,
            ws: null,
            statusText: '未连接',
            maxLogs: 500,
            nextLogId: 1,
            alerts: [],
            showAlerts: false,
            isMobile: window.innerWidth < 768,
            wsConnectStartTime: 0,
            detailDialogVisible: false,
            currentDetail: ''
        },
        computed: {
            filteredLogs() {
                return this.logs.filter(log => this.visibleLevels.includes(log.level));
            },
            statusTagType() {
                if (!this.realtime) return 'info';
                const text = this.statusText || '';
                if (text.includes('已建立')) return 'success';
                if (text.includes('超时')) return 'danger';
                if (text.includes('断开')) return 'warning';
                if (text.includes('未连接')) return 'info';
                return 'info';
            }
        },
        mounted() {
            window.addEventListener('resize', this.handleResize);
            this.connectWs();
            this.fetchAlerts();
            setInterval(this.fetchAlerts, 30000);
        },
        beforeDestroy() {
            window.removeEventListener('resize', this.handleResize);
            if (this.ws) this.ws.close();
        },
        methods: {
            getHistoryLines() {
                return this.detailedMode ? this.maxLogsDetailed : this.maxLogsLite;
            },
            handleDetailedModeChange() {
                const newMax = this.detailedMode ? this.maxLogsDetailed : this.maxLogsLite;
                this.maxLogs = newMax;

                // 切换到非详细模式时，主动裁剪内存日志，降低渲染压力。
                if (this.logs.length > newMax) {
                    const container = this.$refs.console;
                    const anchor = (!this.autoScroll && container) ? this.getScrollAnchor() : null;
                    const beforeScrollHeight = (container ? container.scrollHeight : 0);
                    this.logs.splice(0, this.logs.length - newMax);
                    if (!this.autoScroll && container) {
                        this.restoreScrollAnchor(anchor, beforeScrollHeight);
                    }
                }

                // 重新加载历史（按当前模式拉取更少/更多行）。
                this.loadHistory();
            },
            getScrollAnchor() {
                const container = this.$refs.console;
                if (!container) return null;
                const lines = container.querySelectorAll('.log-line');
                if (!lines || lines.length === 0) return null;
                const scrollTop = container.scrollTop;

                // 找到当前视口顶部可见的第一行（或最接近顶部的行）作为锚点。
                let anchorEl = null;
                for (let i = 0; i < lines.length; i++) {
                    const el = lines[i];
                    if (el.offsetTop + el.offsetHeight > scrollTop) {
                        anchorEl = el;
                        break;
                    }
                }
                if (!anchorEl) anchorEl = lines[lines.length - 1];

                const id = anchorEl.getAttribute('data-log-id');
                if (!id) return null;
                return {
                    id,
                    offset: scrollTop - anchorEl.offsetTop
                };
            },
            restoreScrollAnchor(anchor, beforeScrollHeight) {
                const container = this.$refs.console;
                if (!container || !anchor || !anchor.id) return;

                this.$nextTick(() => {
                    const c = this.$refs.console;
                    if (!c) return;
                    const el = c.querySelector(`.log-line[data-log-id="${anchor.id}"]`);
                    if (el) {
                        c.scrollTop = el.offsetTop + anchor.offset;
                        return;
                    }
                    // 锚点行被裁剪掉了：退化为按 scrollHeight 差值补偿，尽量减少跳动。
                    if (typeof beforeScrollHeight === 'number') {
                        const afterScrollHeight = c.scrollHeight;
                        const delta = afterScrollHeight - beforeScrollHeight;
                        c.scrollTop = c.scrollTop + delta;
                    }
                });
            },
            handleResize() {
                this.isMobile = window.innerWidth < 768;
            },
            showDetail(message) {
                this.currentDetail = message;
                this.detailDialogVisible = true;
            },
            copyDetail() {
                const el = document.createElement('textarea');
                el.value = this.currentDetail;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                this.$message.success('已复制到剪贴板');
            },
            connectWs() {
                if (!this.realtime) return;
                
                // 记录开始连接时间，用于超时判断
                if (this.wsConnectStartTime === 0) {
                    this.wsConnectStartTime = Date.now();
                }

                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const host = window.location.host;
                this.ws = new WebSocket(`${protocol}//${host}/ws/log`);
                
                this.ws.onopen = () => {
                    this.statusText = '实时连接已建立';
                    this.wsConnectStartTime = 0; // 连接成功，重置计时
                    this.loadHistory();
                };
                
                this.ws.onmessage = (event) => {
                    try {
                        const log = JSON.parse(event.data);
                        this.addLog(log);
                    } catch (e) {
                        this.addLog({
                            timestamp: new Date().toLocaleTimeString(),
                            level: 'INFO',
                            message: event.data
                        });
                    }
                };
                
                this.ws.onclose = () => {
                    this.statusText = '连接断开';
                    if (this.realtime) {
                        // 检查是否超时 (30秒)
                        if (this.wsConnectStartTime > 0 && (Date.now() - this.wsConnectStartTime > 30000)) {
                            this.realtime = false;
                            this.statusText = '连接超时，已自动关闭实时推送';
                            this.wsConnectStartTime = 0;
                            this.$message.warning('实时日志连接超时，已自动停止重连。');
                        } else {
                            setTimeout(this.connectWs, 3000);
                        }
                    }
                };
            },
            toggleRealtime() {
                if (this.realtime) {
                    this.wsConnectStartTime = Date.now(); // 手动开启时重置计时
                    this.connectWs();
                } else {
                    if (this.ws) this.ws.close();
                    this.statusText = '已暂停';
                    this.wsConnectStartTime = 0;
                }
            },
            addLog(log) {
                // 为每条日志生成稳定 key，避免裁剪/过滤导致 DOM 复用引起滚动位移
                if (log && (log.__id === undefined || log.__id === null)) {
                    log.__id = String(this.nextLogId++);
                }

                // 关闭自动滚动时，达到上限裁剪会删掉顶部内容。
                // 用“锚点行”锁定当前视口位置，裁剪后恢复 scrollTop，避免位移。
                const willTrim = (this.logs.length + 1 > this.maxLogs);
                const container = this.$refs.console;
                let anchor = null;
                let beforeScrollHeight = 0;
                if (willTrim && !this.autoScroll && container) {
                    anchor = this.getScrollAnchor();
                    beforeScrollHeight = container.scrollHeight;
                }

                this.logs.push(log);

                // 前端日志数量限制：避免 logs 无限增长导致浏览器内存/渲染压力过大。
                // 为解决“关闭自动滚动时，因删除旧日志导致滚动跳动”的问题：
                // 在裁剪前记录滚动高度与 scrollTop，裁剪后按高度变化补偿 scrollTop。
                if (willTrim) {
                    const removeCount = this.logs.length - this.maxLogs;
                    if (removeCount > 0) {
                        this.logs.splice(0, removeCount);
                    }
                }
                if (willTrim && !this.autoScroll && container) {
                    this.restoreScrollAnchor(anchor, beforeScrollHeight);
                }
                
                if (this.autoScroll) {
                    this.$nextTick(() => {
                        const container = this.$refs.console;
                        if (container) container.scrollTop = container.scrollHeight;
                    });
                }
            },
            loadHistory() {
                this.loadingHistory = true;
                const lines = this.getHistoryLines();
                fetch(`/log/history?lines=${lines}`)
                    .then(res => res.json())
                    .then(lines => {
                        // 格式: 2023-01-01 12:00:00.000 | INFO  | thread | logger | message
                        const parsedLogs = lines.map(line => {
                            const parts = line.split('|');
                            if (parts.length >= 5) {
                                return {
                                    timestamp: parts[0].trim(),
                                    level: parts[1].trim(),
                                    thread: parts[2].trim(),
                                    logger: parts[3].trim(),
                                    message: parts.slice(4).join('|').trim()
                                };
                            } else {
                                return {
                                    timestamp: '',
                                    level: 'INFO',
                                    message: line
                                };
                            }
                        });
                        // 赋予稳定 id
                        const base = this.nextLogId;
                        for (let i = 0; i < parsedLogs.length; i++) {
                            parsedLogs[i].__id = String(base + i);
                        }
                        this.nextLogId = base + parsedLogs.length;
                        this.logs = parsedLogs;
                        this.loadingHistory = false;
                        this.$nextTick(() => {
                            const container = this.$refs.console;
                            if (container) container.scrollTop = container.scrollHeight;
                        });
                    })
                    .catch(err => {
                        console.error(err);
                        this.loadingHistory = false;
                        this.$message.error('加载历史日志失败');
                    });
            },
            clearLogs() {
                this.logs = [];
            },
            fetchAlerts() {
                fetch('/log/alerts')
                    .then(res => res.json())
                    .then(data => {
                        this.alerts = data;
                        if (this.alerts.length > 0 && !this.showAlerts) {
                            this.$notify({
                                title: '系统异常提醒',
                                message: `发现 ${this.alerts.length} 条异常记录，请点击查看。`,
                                type: 'warning',
                                position: 'bottom-right'
                            });
                        }
                    })
                    .catch(e => console.error(e));
            },
            clearAlerts() {
                fetch('/log/alerts', { method: 'DELETE' })
                    .then(() => {
                        this.alerts = [];
                        this.showAlerts = false;
                        this.$message.success('已清除所有异常记录');
                    })
                    .catch(e => {
                        console.error(e);
                        this.$message.error('清除失败');
                    });
            },
            formatDate(dateStr) {
                return new Date(dateStr).toLocaleString();
            },
            getAlertType(type) {
                if (type === 'RISK_CONTROL') return 'danger';
                if (type === 'AUTH_FAILED') return 'danger';
                return 'warning';
            },
            handleSelectionModeChange(val) {
                if (!val) {
                    this.selectedLogs = new Set();
                }
            },
            isSelected(log) {
                return this.selectionMode && this.selectedLogs.has(log);
            },
            handleLogClick(log) {
                if (!this.selectionMode) return;
                
                if (this.selectedLogs.has(log)) {
                    this.selectedLogs.delete(log);
                    // Force update for Set reactivity
                    this.selectedLogs = new Set(this.selectedLogs);
                } else {
                    this.selectedLogs.add(log);
                    this.selectedLogs = new Set(this.selectedLogs);
                }
                
                this.copySelectedLogs();
            },
            copySelectedLogs() {
                if (this.selectedLogs.size === 0) return;

                // Filter logs to maintain order
                const selectedContent = this.logs
                    .filter(log => this.selectedLogs.has(log))
                    .map(log => {
                        let line = `${log.timestamp} ${log.level}`;
                        if (log.thread) line += ` [${log.thread}]`;
                        line += ` ${log.message}`;
                        return line;
                    })
                    .join('\n');

                if (navigator.clipboard) {
                    navigator.clipboard.writeText(selectedContent).then(() => {
                        this.$message.success({
                            message: `已复制 ${this.selectedLogs.size} 条日志到剪贴板`,
                            duration: 1500
                        });
                    }).catch(err => {
                        console.error('Failed to copy: ', err);
                        this.$message.error('复制失败');
                    });
                } else {
                    // Fallback
                    const textArea = document.createElement("textarea");
                    textArea.value = selectedContent;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        this.$message.success({
                            message: `已复制 ${this.selectedLogs.size} 条日志到剪贴板`,
                            duration: 1500
                        });
                    } catch (err) {
                        console.error('Fallback copy failed', err);
                        this.$message.error('复制失败');
                    }
                    document.body.removeChild(textArea);
                }
            },
            formatLogMessage(message) {
                if (!message) return '';

                // 隐私模式掩码处理在HTML转义/高亮之前进行.
                const masked = this.maskLogLine(message);
                // 转义HTML特殊字符
                let text = masked.replace(/&/g, "&amp;")
                                .replace(/</g, "&lt;")
                                .replace(/>/g, "&gt;")
                                .replace(/"/g, "&quot;")
                                .replace(/'/g, "&#039;");

                // 语法高亮的正则表达式
                // 分组: 1:实体, 2:URL, 3:日期, 4:路径, 5:括号, 6:数字
                const regex = /(&[a-zA-Z]+;|&#\d+;|&#x[0-9a-fA-F]+;)|(https?:\/\/[^\s"']+)|(\d{4}-\d{2}-\d{2}(?:T|\s)\d{2}:\d{2}:\d{2}(?:\.\d{1,3})?)|([a-zA-Z]:\\[^\s"']+|(?:\/[\w\-.][\w\-.\/]+))|([\{\}\[\]])|(\d+)/g;

                return text.replace(regex, (match, entity, url, date, path, bracket, number) => {
                    if (entity) return match;
                    if (url) return `<span class="log-url">${url}</span>`;
                    if (date) return `<span class="log-date">${date}</span>`;
                    if (path) return `<span class="log-path">${path}</span>`;
                    if (bracket) return `<span class="log-bracket">${bracket}</span>`;
                    if (number) return `<span class="log-number">${number}</span>`;
                    return match;
                });
            }
        }
    });
</script>
</body>
</html>
