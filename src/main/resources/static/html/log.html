<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志控制台</title>
    <link href="../css/element-ui.css" rel="stylesheet">
    <link href="../css/index.css" rel="stylesheet">
    <script src="../js/jquery-3.3.1.min.js"></script>
    <script src="../js/vue.min.js"></script>
    <script src="../js/element-ui.js"></script>
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        #app { height: 100%; display: flex; flex-direction: column; padding: 10px; box-sizing: border-box; }
        .toolbar { margin-bottom: 10px; }
        .toolbar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .log-console { 
            flex: 1; 
            background-color: #1e1e1e; 
            color: #d4d4d4; 
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace; 
            padding: 10px; 
            overflow-y: auto; 
            border-radius: 4px; 
            font-size: 13px;
            line-height: 1.4;
        }
        .log-line { white-space: pre-wrap; word-break: break-all; margin-bottom: 2px; }
        .log-line:hover { background-color: #2a2d2e; }
        .log-time { color: #569cd6; margin-right: 8px; }
        .log-level { font-weight: bold; margin-right: 8px; }
        .log-thread { color: #4ec9b0; margin-right: 8px; }
        .level-INFO { color: #4caf50; }
        .level-WARN { color: #ce9178; }
        .level-ERROR { color: #f44747; }
        .level-DEBUG { color: #9cdcfe; }
        
        @media (max-width: 768px) {
            .toolbar-row { gap: 5px; }
            .el-button--small, .el-button--small.is-round { padding: 9px 15px; }
            .log-time { display: none; } /* Hide time on very small screens to save space */
            .log-thread { display: none; }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="toolbar">
        <el-row :gutter="10" class="toolbar-row">
            <el-col :xs="24" :sm="12" :md="8" :lg="6">
                <el-button-group style="width: 100%; display: flex;">
                    <el-button size="small" type="danger" @click="clearLogs" style="flex: 1;">清空</el-button>
                    <el-button size="small" type="warning" icon="el-icon-warning" v-if="alerts.length > 0" @click="showAlerts = true" style="flex: 1;">
                        异常({{ alerts.length }})
                    </el-button>
                </el-button-group>
            </el-col>
            
            <el-col :xs="24" :sm="12" :md="8" :lg="6">
                <el-select v-model="visibleLevels" multiple collapse-tags placeholder="日志等级" size="small" style="width: 100%;">
                    <el-option label="INFO" value="INFO"></el-option>
                    <el-option label="WARN" value="WARN"></el-option>
                    <el-option label="ERROR" value="ERROR"></el-option>
                    <el-option label="DEBUG" value="DEBUG"></el-option>
                </el-select>
            </el-col>

            <el-col :xs="24" :sm="24" :md="8" :lg="12" style="display: flex; align-items: center; justify-content: flex-end; gap: 10px;">
                <el-switch v-model="autoScroll" active-text="自动滚动"></el-switch>
                <el-switch v-model="realtime" active-text="实时推送" @change="toggleRealtime"></el-switch>
                <span style="font-size: 12px; color: #888; margin-left: 5px;" class="hidden-xs-only">{{ statusText }}</span>
            </el-col>
        </el-row>
    </div>

    <div class="log-console" ref="console">
        <div v-for="(log, index) in filteredLogs" :key="index" class="log-line">
            <span class="log-time">{{ log.timestamp }}</span>
            <span class="log-level" :class="'level-' + log.level">{{ log.level }}</span>
            <span class="log-thread" v-if="log.thread">[{{ log.thread }}]</span>
            <span class="log-message">{{ log.message }}</span>
        </div>
    </div>

    <el-dialog title="系统异常提醒" :visible.sync="showAlerts" width="90%" :fullscreen="isMobile">
        <el-alert
            title="这些异常是在您离线期间或最近发生的，请检查。"
            type="warning"
            :closable="false"
            style="margin-bottom: 10px;">
        </el-alert>
        <el-table :data="alerts" stripe style="width: 100%" height="300">
            <el-table-column prop="timestamp" label="时间" width="160">
                <template slot-scope="scope">{{ formatDate(scope.row.timestamp) }}</template>
            </el-table-column>
            <el-table-column prop="type" label="类型" width="120">
                <template slot-scope="scope">
                    <el-tag :type="getAlertType(scope.row.type)" size="mini">{{ scope.row.type }}</el-tag>
                </template>
            </el-table-column>
            <el-table-column prop="message" label="详情" min-width="200"></el-table-column>
        </el-table>
        <span slot="footer" class="dialog-footer">
            <el-button type="danger" @click="clearAlerts">清除所有</el-button>
            <el-button @click="showAlerts = false">关 闭</el-button>
        </span>
    </el-dialog>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            logs: [],
            visibleLevels: ['INFO', 'WARN', 'ERROR'],
            autoScroll: true,
            realtime: true,
            loadingHistory: false,
            ws: null,
            statusText: '未连接',
            maxLogs: 2000,
            alerts: [],
            showAlerts: false,
            isMobile: window.innerWidth < 768,
            wsConnectStartTime: 0
        },
        computed: {
            filteredLogs() {
                return this.logs.filter(log => this.visibleLevels.includes(log.level));
            }
        },
        mounted() {
            window.addEventListener('resize', this.handleResize);
            this.connectWs();
            this.fetchAlerts();
            setInterval(this.fetchAlerts, 30000);
        },
        beforeDestroy() {
            window.removeEventListener('resize', this.handleResize);
            if (this.ws) this.ws.close();
        },
        methods: {
            handleResize() {
                this.isMobile = window.innerWidth < 768;
            },
            connectWs() {
                if (!this.realtime) return;
                
                // 记录开始连接时间，用于超时判断
                if (this.wsConnectStartTime === 0) {
                    this.wsConnectStartTime = Date.now();
                }

                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const host = window.location.host;
                this.ws = new WebSocket(`${protocol}//${host}/ws/log`);
                
                this.ws.onopen = () => {
                    this.statusText = '实时连接已建立';
                    this.wsConnectStartTime = 0; // 连接成功，重置计时
                    this.loadHistory();
                };
                
                this.ws.onmessage = (event) => {
                    try {
                        const log = JSON.parse(event.data);
                        this.addLog(log);
                    } catch (e) {
                        this.addLog({
                            timestamp: new Date().toLocaleTimeString(),
                            level: 'INFO',
                            message: event.data
                        });
                    }
                };
                
                this.ws.onclose = () => {
                    this.statusText = '连接断开';
                    if (this.realtime) {
                        // 检查是否超时 (30秒)
                        if (this.wsConnectStartTime > 0 && (Date.now() - this.wsConnectStartTime > 30000)) {
                            this.realtime = false;
                            this.statusText = '连接超时，已自动关闭实时推送';
                            this.wsConnectStartTime = 0;
                            this.$message.warning('实时日志连接超时，已自动停止重连。');
                        } else {
                            setTimeout(this.connectWs, 3000);
                        }
                    }
                };
            },
            toggleRealtime() {
                if (this.realtime) {
                    this.wsConnectStartTime = Date.now(); // 手动开启时重置计时
                    this.connectWs();
                } else {
                    if (this.ws) this.ws.close();
                    this.statusText = '已暂停';
                    this.wsConnectStartTime = 0;
                }
            },
            addLog(log) {
                this.logs.push(log);
                // 暂时取消前端日志数量限制，避免滚动条抖动
                // if (this.logs.length > this.maxLogs) {
                //     this.logs.shift();
                // }
                
                if (this.autoScroll) {
                    this.$nextTick(() => {
                        const container = this.$refs.console;
                        if (container) container.scrollTop = container.scrollHeight;
                    });
                }
            },
            loadHistory() {
                this.loadingHistory = true;
                fetch('/log/history?lines=2000')
                    .then(res => res.json())
                    .then(lines => {
                        // 格式: 2023-01-01 12:00:00.000 | INFO  | thread | logger | message
                        const parsedLogs = lines.map(line => {
                            const parts = line.split('|');
                            if (parts.length >= 5) {
                                return {
                                    timestamp: parts[0].trim(),
                                    level: parts[1].trim(),
                                    thread: parts[2].trim(),
                                    logger: parts[3].trim(),
                                    message: parts.slice(4).join('|').trim()
                                };
                            } else {
                                return {
                                    timestamp: '',
                                    level: 'INFO',
                                    message: line
                                };
                            }
                        });
                        this.logs = parsedLogs;
                        this.loadingHistory = false;
                        this.$nextTick(() => {
                            const container = this.$refs.console;
                            if (container) container.scrollTop = container.scrollHeight;
                        });
                    })
                    .catch(err => {
                        console.error(err);
                        this.loadingHistory = false;
                        this.$message.error('加载历史日志失败');
                    });
            },
            clearLogs() {
                this.logs = [];
            },
            fetchAlerts() {
                fetch('/log/alerts')
                    .then(res => res.json())
                    .then(data => {
                        this.alerts = data;
                        if (this.alerts.length > 0 && !this.showAlerts) {
                            this.$notify({
                                title: '系统异常提醒',
                                message: `发现 ${this.alerts.length} 条异常记录，请点击查看。`,
                                type: 'warning',
                                position: 'bottom-right'
                            });
                        }
                    })
                    .catch(e => console.error(e));
            },
            clearAlerts() {
                this.alerts = [];
                this.showAlerts = false;
            },
            formatDate(dateStr) {
                return new Date(dateStr).toLocaleString();
            },
            getAlertType(type) {
                if (type === 'RISK_CONTROL') return 'danger';
                if (type === 'AUTH_FAILED') return 'danger';
                return 'warning';
            }
        }
    });
</script>
</body>
</html>
