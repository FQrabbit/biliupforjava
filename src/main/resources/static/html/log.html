<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志控制台</title>
    <link href="../css/element-ui.css" rel="stylesheet">
    <link href="../css/index.css" rel="stylesheet">
    <script src="../js/jquery-3.3.1.min.js"></script>
    <script src="../js/vue.min.js"></script>
    <script src="../js/element-ui.js"></script>
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        #app { height: 100%; display: flex; flex-direction: column; padding: 10px; box-sizing: border-box; }
        .toolbar { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .log-console { 
            flex: 1; 
            background-color: #1e1e1e; 
            color: #d4d4d4; 
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace; 
            padding: 10px; 
            overflow-y: auto; 
            border-radius: 4px; 
            font-size: 13px;
            line-height: 1.4;
        }
        .log-line { white-space: pre-wrap; word-break: break-all; margin-bottom: 2px; }
        .log-line:hover { background-color: #2a2d2e; }
        .log-time { color: #569cd6; margin-right: 8px; }
        .log-level { font-weight: bold; margin-right: 8px; }
        .log-thread { color: #4ec9b0; margin-right: 8px; }
        .level-INFO { color: #4caf50; }
        .level-WARN { color: #ce9178; }
        .level-ERROR { color: #f44747; }
        .level-DEBUG { color: #9cdcfe; }
    </style>
</head>
<body>
<div id="app">
    <div class="toolbar">
        <el-button-group>
            <el-button size="small" type="primary" @click="loadHistory" :loading="loadingHistory">加载历史</el-button>
            <el-button size="small" type="danger" @click="clearLogs">清空</el-button>
        </el-button-group>
        
        <el-divider direction="vertical"></el-divider>
        
        <el-checkbox-group v-model="visibleLevels" size="small">
            <el-checkbox label="INFO">INFO</el-checkbox>
            <el-checkbox label="WARN">WARN</el-checkbox>
            <el-checkbox label="ERROR">ERROR</el-checkbox>
            <el-checkbox label="DEBUG">DEBUG</el-checkbox>
        </el-checkbox-group>
    
        <el-divider direction="vertical"></el-divider>
    
        <el-switch v-model="autoScroll" active-text="自动滚动"></el-switch>
        <el-switch v-model="realtime" active-text="实时推送" @change="toggleRealtime"></el-switch>
        
        <el-button size="small" type="warning" icon="el-icon-warning" v-if="alerts.length > 0" @click="showAlerts = true" style="margin-left: auto;">
            异常提醒 ({{ alerts.length }})
        </el-button>
        <span v-else style="margin-left: auto; font-size: 12px; color: #888;">{{ statusText }}</span>
    </div>

    <div class="log-console" ref="console">
        <div v-for="(log, index) in filteredLogs" :key="index" class="log-line">
            <span class="log-time">{{ log.timestamp }}</span>
            <span class="log-level" :class="'level-' + log.level">{{ log.level }}</span>
            <span class="log-thread" v-if="log.thread">[{{ log.thread }}]</span>
            <span class="log-message">{{ log.message }}</span>
        </div>
    </div>

    <el-dialog title="系统异常提醒" :visible.sync="showAlerts" width="70%">
        <el-alert
            title="这些异常是在您离线期间或最近发生的，请检查。"
            type="warning"
            :closable="false"
            style="margin-bottom: 10px;">
        </el-alert>
        <el-table :data="alerts" stripe style="width: 100%" height="400">
            <el-table-column prop="timestamp" label="时间" width="180">
                <template slot-scope="scope">{{ formatDate(scope.row.timestamp) }}</template>
            </el-table-column>
            <el-table-column prop="type" label="类型" width="150">
                <template slot-scope="scope">
                    <el-tag :type="getAlertType(scope.row.type)">{{ scope.row.type }}</el-tag>
                </template>
            </el-table-column>
            <el-table-column prop="message" label="详情"></el-table-column>
        </el-table>
        <span slot="footer" class="dialog-footer">
            <el-button @click="showAlerts = false">关 闭</el-button>
        </span>
    </el-dialog>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            logs: [],
            visibleLevels: ['INFO', 'WARN', 'ERROR'],
            autoScroll: true,
            realtime: true,
            loadingHistory: false,
            ws: null,
            statusText: '未连接',
            maxLogs: 2000,
            alerts: [],
            showAlerts: false
        },
        computed: {
            filteredLogs() {
                return this.logs.filter(log => this.visibleLevels.includes(log.level));
            }
        },
        mounted() {
            this.connectWs();
            this.fetchAlerts();
            setInterval(this.fetchAlerts, 30000);
        },
        beforeDestroy() {
            if (this.ws) this.ws.close();
        },
        methods: {
            connectWs() {
                if (!this.realtime) return;
                
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const host = window.location.host;
                this.ws = new WebSocket(`${protocol}//${host}/ws/log`);
                
                this.ws.onopen = () => {
                    this.statusText = '实时连接已建立';
                };
                
                this.ws.onmessage = (event) => {
                    try {
                        const log = JSON.parse(event.data);
                        this.addLog(log);
                    } catch (e) {
                        this.addLog({
                            timestamp: new Date().toLocaleTimeString(),
                            level: 'INFO',
                            message: event.data
                        });
                    }
                };
                
                this.ws.onclose = () => {
                    this.statusText = '连接断开';
                    if (this.realtime) setTimeout(this.connectWs, 3000);
                };
            },
            toggleRealtime() {
                if (this.realtime) {
                    this.connectWs();
                } else {
                    if (this.ws) this.ws.close();
                    this.statusText = '已暂停';
                }
            },
            addLog(log) {
                this.logs.push(log);
                if (this.logs.length > this.maxLogs) {
                    this.logs.shift();
                }
                if (this.autoScroll) {
                    this.$nextTick(() => {
                        const container = this.$refs.console;
                        if (container) container.scrollTop = container.scrollHeight;
                    });
                }
            },
            loadHistory() {
                this.loadingHistory = true;
                fetch('/log/history?lines=2000')
                    .then(res => res.json())
                    .then(lines => {
                        // 格式: 2023-01-01 12:00:00.000 | INFO  | thread | logger | message
                        const parsedLogs = lines.map(line => {
                            const parts = line.split('|');
                            if (parts.length >= 5) {
                                return {
                                    timestamp: parts[0].trim(),
                                    level: parts[1].trim(),
                                    thread: parts[2].trim(),
                                    logger: parts[3].trim(),
                                    message: parts.slice(4).join('|').trim()
                                };
                            } else {
                                return {
                                    timestamp: '',
                                    level: 'INFO',
                                    message: line
                                };
                            }
                        });
                        this.logs = parsedLogs;
                        this.loadingHistory = false;
                        this.$nextTick(() => {
                            const container = this.$refs.console;
                            if (container) container.scrollTop = container.scrollHeight;
                        });
                    })
                    .catch(err => {
                        console.error(err);
                        this.loadingHistory = false;
                        this.$message.error('加载历史日志失败');
                    });
            },
            clearLogs() {
                this.logs = [];
            },
            fetchAlerts() {
                fetch('/log/alerts')
                    .then(res => res.json())
                    .then(data => {
                        this.alerts = data;
                        if (this.alerts.length > 0 && !this.showAlerts) {
                            this.$notify({
                                title: '系统异常提醒',
                                message: `发现 ${this.alerts.length} 条异常记录，请点击查看。`,
                                type: 'warning',
                                position: 'bottom-right'
                            });
                        }
                    })
                    .catch(e => console.error(e));
            },
            formatDate(dateStr) {
                return new Date(dateStr).toLocaleString();
            },
            getAlertType(type) {
                if (type === 'RISK_CONTROL') return 'danger';
                if (type === 'AUTH_FAILED') return 'danger';
                return 'warning';
            }
        }
    });
</script>
</body>
</html>
