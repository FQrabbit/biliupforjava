<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Bilibili Upload Captcha</title>
    <script src="../js/vue.min.js"></script>
    <script src="../js/jquery-3.3.1.min.js"></script>
    <script src="../js/element-ui.js"></script>
    <link rel="stylesheet" href="../css/element-ui.css">
    <script src="https://static.geetest.com/v4/gt4.js"></script>
</head>
<body>
<div id="app">
    <el-card class="box-card" style="width: 600px; margin: 100px auto;">
        <div slot="header" class="clearfix">
            <span>Bilibili 投稿验证码</span>
        </div>
        <div v-if="loading">
            正在检查验证码状态...
        </div>
        <div v-else-if="!required">
            <el-result icon="success" title="无需验证" subTitle="当前没有等待验证的上传任务"></el-result>
        </div>
        <div v-else>
            <el-alert
                    title="检测到上传任务需要验证码"
                    type="warning"
                    :description="'文件名: ' + filename"
                    show-icon>
            </el-alert>

            <!-- 新增：显示详细调试信息，方便用户判断验证类型 -->
            <el-collapse style="margin-top: 10px;">
                <el-collapse-item title="查看 B站返回的详细要求 (Debug Info)" name="1">
                    <div style="background-color: var(--bg-tertiary, #f5f7fa); padding: 10px; border-radius: 4px;">
                        <pre style="margin: 0; white-space: pre-wrap; word-wrap: break-word;">{{ JSON.stringify(extra, null, 2) }}</pre>
                    </div>
                    <div style="margin-top: 5px; color: #909399; font-size: 12px;">
                        * 如果这里显示需要手机验证或其他非滑块验证，请在浏览器完成验证后，点击下方的“已在网页完成验证”按钮。
                    </div>
                </el-collapse-item>
            </el-collapse>

            <div style="margin-top: 20px;">
                <div id="captcha-box"></div>
            </div>
            <div v-if="captchaSuccess" style="margin-top: 20px; text-align: center;">
                <el-button type="primary" @click="submitCaptcha" :loading="submitting">提交验证结果</el-button>
            </div>

            <el-divider content-position="center">或者手动处理</el-divider>
            
            <el-form label-width="80px">
                <el-alert title="方案 B：在 B站官网验证 (100%成功，推荐)" type="success" :closable="false" style="margin-bottom: 10px;">
                    <template slot="title">
                        <div style="font-weight: bold; margin-bottom: 5px;">如果上方验证失败，请使用此“逃课”方案：</div>
                        <ol style="margin-left: 20px; line-height: 1.8;">
                            <li>在浏览器新标签页打开 <a href="https://member.bilibili.com/platform/upload/video/frame" target="_blank">B站投稿页</a> 并登录。</li>
                            <li>按 <kbd>F12</kbd> 打开控制台 (Console)，复制并运行下方代码：</li>
                        </ol>
                        <div style="margin: 5px 0;">
                            <el-input type="textarea" readonly :value="hookScript" rows="4" style="font-family: monospace; font-size: 12px;"></el-input>
                            <el-button size="mini" type="text" @click="copyScript">复制代码</el-button>
                        </div>
                        <ol start="3" style="margin-left: 20px; line-height: 1.8;">
                            <li>在 B站页面随便上传一个视频，触发并完成验证。</li>
                            <li>脚本会自动将 Token 发送回本系统，您无需做其他操作。</li>
                        </ol>
                    </template>
                </el-alert>
                
                <el-collapse>
                    <el-collapse-item title="方案 C：手动抓包填入 (备用)" name="2">
                        <el-form-item label="结果JSON">
                            <el-input type="textarea" v-model="manualJson" placeholder='例如: {"validate": "...", "seccode": "..."}' rows="3"></el-input>
                        </el-form-item>
                        <el-form-item>
                            <el-button @click="submitManual" type="success" :loading="submitting">提交手动结果</el-button>
                        </el-form-item>
                    </el-collapse-item>
                </el-collapse>
            </el-form>
        </div>
    </el-card>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            loading: true,
            required: false,
            voucher: '',
            filename: '',
            extra: {},
            captchaObj: null,
            captchaResult: null,
            captchaSuccess: false,
            submitting: false,
            timer: null,
            manualJson: '',
            // 自动生成的 Hook 脚本，动态插入当前服务器地址
            hookScript: `(function(){
    var targetUrl = "${window.location.origin}/captcha/submit";
    console.log("正在监听 B站验证码请求...");
    
    // 监听 fetch
    var originalFetch = window.fetch;
    window.fetch = function(input, init) {
        if (typeof input === 'string' && (input.includes('add/v3') || input.includes('validate'))) {
            // 尝试从 URL 或 Body 中提取 token
            try {
                var token = null;
                if (input.includes('captcha_token=')) {
                    token = input.match(/captcha_token=([^&]+)/)[1];
                } else if (init && init.body) {
                    if (init.body.includes('captcha_token')) {
                        var body = JSON.parse(init.body);
                        token = body.captcha_token;
                    }
                }
                
                if (token) {
                    console.log("捕获到 Token: " + token);
                    var data = { captcha_token: token };
                    // 使用 sendBeacon 或 XHR 跨域发送 (需要后端支持 CORS，或者手动复制)
                    // 这里为了简单，直接弹窗提示用户复制
                    prompt("捕获到验证码 Token，请全选复制并填入工具的【手动结果】框中：", JSON.stringify(data));
                }
            } catch(e) { console.error(e); }
        }
        return originalFetch.apply(this, arguments);
    };
    
    alert("脚本注入成功！请现在上传视频触发验证。");
})();`
        },
        mounted() {
            this.checkStatus();
            this.timer = setInterval(this.checkStatus, 5000);
        },
        beforeDestroy() {
            if (this.timer) clearInterval(this.timer);
        },
        methods: {
            copyScript() {
                const el = document.createElement('textarea');
                el.value = this.hookScript;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                this.$message.success('代码已复制到剪贴板');
            },
            checkStatus() {
                if (this.required && !this.captchaSuccess && !this.manualJson) return; // 如果正在验证中且未手动输入，不要刷新状态
                
                ApiUtil.get('/captcha/status', (res) => {
                    this.loading = false;
                    if (res.required) {
                        if (this.voucher !== res.voucher) {
                            this.required = true;
                            this.voucher = res.voucher;
                            this.filename = res.filename;
                            this.extra = res.extra || {};
                            this.initCaptcha();
                        }
                    } else {
                        this.required = false;
                        this.voucher = '';
                        this.filename = '';
                        this.captchaSuccess = false;
                        this.captchaResult = null;
                        this.manualJson = '';
                        if (this.captchaObj) {
                            // 清理旧的验证码实例
                            $('#captcha-box').empty();
                            this.captchaObj = null;
                        }
                    }
                });
            },
            initCaptcha() {
                
                console.log("Extra info:", this.extra);
                
                // B站投稿通常使用固定的 captchaId
                const BILI_UPLOAD_CAPTCHA_ID = 'a431eaf5e5dadd28bc0553c29682bd4b';
                
                // V4 初始化逻辑 (默认尝试)
                initGeetest4({
                    captchaId: BILI_UPLOAD_CAPTCHA_ID,
                    product: 'popup'
                }, (captchaObj) => {
                    this.captchaObj = captchaObj;
                    captchaObj.appendTo("#captcha-box");
                    captchaObj.onSuccess(() => {
                        let result = captchaObj.getValidate();
                        console.log("Geetest V4 Result:", result);
                        
                        this.captchaResult = {
                            // V4 标准参数
                            lot_number: result.lot_number,
                            pass_token: result.pass_token,
                            gen_time: result.gen_time,
                            captcha_output: result.captcha_output,
                            captcha_id: BILI_UPLOAD_CAPTCHA_ID
                        };
                        this.captchaSuccess = true;
                    });
                    captchaObj.onError((e) => {
                        console.error("Geetest V4 Error:", e);
                        this.$message.error("验证码加载失败，请尝试手动处理");
                    });
                });
            },
            submitCaptcha() {
                if (!this.captchaResult) return;
                this.doSubmit(this.captchaResult);
            },
            submitManual() {
                if (!this.manualJson) {
                    this.$message.warning('请输入JSON内容');
                    return;
                }
                try {
                    let result = JSON.parse(this.manualJson);
                    this.doSubmit(result);
                } catch (e) {
                    this.$message.error('JSON格式错误');
                }
            },
            submitRetry() {
                this.$confirm('确认已在浏览器完成验证？程序将尝试重新发起上传请求。', '提示', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }).then(() => {
                    this.doSubmit({});
                });
            },
            doSubmit(data) {
                this.submitting = true;
                
                ApiUtil.post('/captcha/submit', data, (res) => {
                    this.$message.success('提交成功，上传将继续');
                    this.submitting = false;
                    this.required = false; // 暂时隐藏，等待下一次轮询确认
                    this.captchaSuccess = false;
                    this.manualJson = '';
                }, (xhr) => {
                    this.$message.error('提交失败');
                    this.submitting = false;
                });
            }
        }
    });
</script>
</body>
</html>
