<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 - 录播姬上传插件</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../css/element-ui.css" rel="stylesheet">
    <link href="../css/index.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
            background: radial-gradient(1200px 600px at 20% 10%, rgba(91, 108, 255, 0.20), transparent 60%),
                        radial-gradient(900px 500px at 80% 30%, rgba(82, 196, 26, 0.12), transparent 60%),
                        linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #cbd5e1 100%);
            color: var(--text-primary);
            overflow-x: hidden;
            overflow-y: auto;
        }

        [data-theme="dark"] body {
            background: radial-gradient(1100px 600px at 20% 10%, rgba(123, 143, 255, 0.22), transparent 60%),
                        radial-gradient(900px 520px at 80% 30%, rgba(82, 196, 26, 0.10), transparent 60%),
                        linear-gradient(135deg, #0a0a0c 0%, #12121a 50%, #1a1a24 100%);
        }

        .login-page {
            position: relative;
            min-height: 100svh;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .login-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-blob {
            position: absolute;
            width: 520px;
            height: 520px;
            border-radius: 999px;
            filter: blur(40px);
            opacity: 0.75;
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        .bg-blob .blob-inner {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            will-change: transform, opacity;
            transform: translate3d(0, 0, 0);
        }

        .bg-blob.blob-1 {
            left: -160px;
            top: -180px;
        }

        .bg-blob.blob-1 .blob-inner {
            background: radial-gradient(circle at 30% 30%, rgba(91, 108, 255, 0.55), rgba(91, 108, 255, 0) 60%);
            animation: float-1 16s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .bg-blob.blob-2 {
            right: -220px;
            top: 80px;
        }

        .bg-blob.blob-2 .blob-inner {
            background: radial-gradient(circle at 40% 40%, rgba(82, 196, 26, 0.30), rgba(82, 196, 26, 0) 62%);
            animation: float-2 18s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .bg-blob.blob-3 {
            left: 20%;
            bottom: -240px;
            width: 620px;
            height: 620px;
        }

        .bg-blob.blob-3 .blob-inner {
            background: radial-gradient(circle at 35% 35%, rgba(250, 173, 20, 0.22), rgba(250, 173, 20, 0) 62%);
            animation: float-3 22s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes float-1 {
            0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.70; }
            50% { transform: translate3d(140px, 80px, 0) scale(1.08); opacity: 0.88; }
            100% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.70; }
        }

        @keyframes float-2 {
            0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.72; }
            50% { transform: translate3d(-120px, 120px, 0) scale(1.10); opacity: 0.90; }
            100% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.72; }
        }

        @keyframes float-3 {
            0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.55; }
            50% { transform: translate3d(80px, -120px, 0) scale(1.06); opacity: 0.78; }
            100% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.55; }
        }

        @media (prefers-reduced-motion: reduce) {
            .bg-blob .blob-inner { animation: none !important; }
        }

        .login-topbar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 12px;
            z-index: 2;
        }

        .brand-mini {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            cursor: pointer;
            user-select: none;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast), background var(--transition-fast);
        }

        [data-theme="dark"] .brand-mini {
            background: rgba(24, 24, 27, 0.65);
            border-color: rgba(63, 63, 70, 0.55);
        }

        .brand-mini:hover {
            transform: translateY(-1px);
            border-color: rgba(91, 108, 255, 0.28);
            box-shadow: var(--shadow-md);
        }

        .brand-mini:active {
            transform: translateY(0);
        }

        .brand-mini img {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
        }

        .brand-mini .brand-mini-title {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-primary);
            letter-spacing: 0.2px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-mini .brand-mini-version {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.1px;
        }

        .brand-mini .brand-mini-new {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 18px;
            padding: 0 6px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, var(--danger-color) 0%, #ff7a45 100%);
            box-shadow: 0 10px 22px rgba(255, 77, 79, 0.22);
            transform: translate3d(0, 0, 0);
            animation: badge-pulse 1.8s ease-in-out infinite;
        }

        @keyframes badge-pulse {
            0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.92; }
            50% { transform: translate3d(0, 0, 0) scale(1.06); opacity: 1; }
            100% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.92; }
        }

        @media (prefers-reduced-motion: reduce) {
            .brand-mini .brand-mini-new { animation: none !important; }
        }

        .login-theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.65);
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            cursor: pointer;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast), border-color var(--transition-fast);
        }

        [data-theme="dark"] .login-theme-toggle {
            border-color: rgba(63, 63, 70, 0.55);
            background: rgba(24, 24, 27, 0.65);
        }

        .login-theme-toggle:hover {
            transform: translateY(-1px);
            border-color: rgba(91, 108, 255, 0.35);
            box-shadow: var(--shadow-md);
        }

        .login-theme-toggle:active {
            transform: translateY(0);
        }

        .login-center {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px calc(env(safe-area-inset-bottom, 0px) + 24px);
            position: relative;
            z-index: 1;
        }

        .login-card {
            width: 420px;
            max-width: 100%;
            border-radius: var(--radius-xl);
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.75);
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            overflow: hidden;
            transform: translate3d(0, 0, 0);
            will-change: transform, opacity;
            animation: card-in 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
            position: relative;
        }

        [data-theme="dark"] .login-card {
            border-color: rgba(63, 63, 70, 0.6);
            background: rgba(24, 24, 27, 0.72);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        }

        @keyframes card-in {
            from { opacity: 0; transform: translate3d(0, 12px, 0) scale(0.98); }
            to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-card { animation: none !important; }
        }

        .login-card::before {
            content: "";
            position: absolute;
            inset: -80px -80px auto -80px;
            height: 180px;
            background: radial-gradient(closest-side at 35% 35%, rgba(91, 108, 255, 0.28), transparent 70%);
            transform: translate3d(0, 0, 0);
            pointer-events: none;
        }

        [data-theme="dark"] .login-card::before {
            background: radial-gradient(closest-side at 35% 35%, rgba(123, 143, 255, 0.28), transparent 70%);
        }

        .login-card.is-error {
            border-color: rgba(255, 77, 79, 0.65);
            box-shadow: 0 18px 50px rgba(255, 77, 79, 0.14), var(--shadow-lg);
            animation: card-in 420ms cubic-bezier(0.22, 1, 0.36, 1) both, shake 420ms cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        [data-theme="dark"] .login-card.is-error {
            border-color: rgba(255, 77, 79, 0.70);
            box-shadow: 0 18px 60px rgba(255, 77, 79, 0.18), 0 18px 50px rgba(0, 0, 0, 0.55);
        }

        .login-card.is-error::after {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: calc(var(--radius-xl) + 8px);
            background: radial-gradient(600px 260px at 30% 20%, rgba(255, 77, 79, 0.25), transparent 60%),
                        radial-gradient(420px 220px at 70% 30%, rgba(255, 122, 69, 0.18), transparent 60%);
            filter: blur(18px);
            opacity: 0;
            pointer-events: none;
            transform: translate3d(0, 0, 0);
            animation: error-glow 680ms ease-out both;
        }

        @keyframes error-glow {
            0% { opacity: 0; transform: translate3d(0, 0, 0) scale(0.98); }
            45% { opacity: 1; transform: translate3d(0, 0, 0) scale(1.02); }
            100% { opacity: 0.10; transform: translate3d(0, 0, 0) scale(1); }
        }

        @keyframes shake {
            0% { transform: translate3d(0, 0, 0); }
            12% { transform: translate3d(-8px, 0, 0); }
            24% { transform: translate3d(7px, 0, 0); }
            36% { transform: translate3d(-6px, 0, 0); }
            48% { transform: translate3d(5px, 0, 0); }
            60% { transform: translate3d(-4px, 0, 0); }
            72% { transform: translate3d(3px, 0, 0); }
            84% { transform: translate3d(-2px, 0, 0); }
            100% { transform: translate3d(0, 0, 0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-card.is-error { animation: none !important; }
            .login-card.is-error::after { animation: none !important; opacity: 0.4; }
        }

        .login-inner {
            position: relative;
            padding: 26px 26px 22px;
        }

        .login-header {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        .login-title {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.3px;
            color: var(--text-primary);
        }

        .login-subtitle {
            margin: 0;
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-secondary);
        }

        .login-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 6px 0 14px;
        }

        .login-btn.el-button--primary {
            width: 100%;
            border-radius: 12px;
            height: 42px;
            font-weight: 700;
            letter-spacing: 0.2px;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast);
            box-shadow: 0 10px 24px rgba(91, 108, 255, 0.25);
        }

        .login-btn.el-button--primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 32px rgba(91, 108, 255, 0.28);
        }

        .login-btn.el-button--primary:active {
            transform: translateY(0);
        }

        [data-theme="dark"] .login-btn.el-button--primary {
            box-shadow: 0 14px 34px rgba(123, 143, 255, 0.18);
        }

        .login-card .el-input__inner {
            border-radius: 12px;
            height: 42px;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast);
        }

        .login-card .el-input__inner:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(91, 108, 255, 0.14);
        }

        [data-theme="dark"] .login-card .el-input__inner:focus {
            box-shadow: 0 0 0 4px rgba(123, 143, 255, 0.18);
        }

        @media (max-width: 420px) {
            .login-inner {
                padding: 22px 18px 18px;
            }

            .login-topbar {
                padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px;
                gap: 10px;
            }

            .brand-mini {
                padding: 8px 10px;
                gap: 8px;
            }

            .brand-mini img {
                width: 26px;
                height: 26px;
            }

            .brand-mini .brand-mini-title {
                font-size: 13px;
            }

            .brand-mini .brand-mini-version {
                font-size: 11px;
            }

            .login-theme-toggle {
                width: 38px;
                height: 38px;
            }

            .login-center {
                padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 18px);
            }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="login-page">
        <div class="login-bg" aria-hidden="true">
            <div class="bg-blob blob-1"><div class="blob-inner"></div></div>
            <div class="bg-blob blob-2"><div class="blob-inner"></div></div>
            <div class="bg-blob blob-3"><div class="blob-inner"></div></div>
        </div>

        <div class="login-topbar">
            <div class="brand-mini" @click="goToRelease" :title="hasNewVersion ? '发现新版本，点击打开 Release' : '点击打开 Release'">
                <img src="../img/icon.svg" alt="logo">
                <span class="brand-mini-title">录播姬上传插件</span>
                <span class="brand-mini-version">{{ currentVersion }}</span>
                <span v-if="hasNewVersion" class="brand-mini-new">NEW</span>
            </div>
            <button class="login-theme-toggle" type="button" @click="toggleTheme" :title="theme === 'dark' ? '切换到浅色' : '切换到深色'">
                <i :class="theme === 'dark' ? 'el-icon-sunny' : 'el-icon-moon'"></i>
            </button>
        </div>

        <div class="login-center">
            <el-card class="login-card" shadow="never" :class="{ 'is-error': loginError }">
                <div class="login-inner">
                    <div class="login-header">
                        <h2 class="login-title">欢迎回来</h2>
                        <p class="login-subtitle">请输入用户名和密码，用于访问本地插件管理页面</p>
                    </div>

                    <el-form :model="form" ref="loginForm" @submit.native.prevent="handleLogin">
                        <el-form-item>
                            <el-input v-model="form.username"
                                      placeholder="用户名"
                                      prefix-icon="el-icon-user"
                                      name="username"
                                      autocomplete="username"
                                      @input="onAnyInput"
                                      @keyup.enter.native="handleLogin"></el-input>
                        </el-form-item>
                        <el-form-item>
                            <el-input v-model="form.password"
                                      type="password"
                                      placeholder="密码"
                                      prefix-icon="el-icon-lock"
                                      show-password
                                      name="password"
                                      autocomplete="current-password"
                                      @input="onAnyInput"
                                      @keyup.enter.native="handleLogin"></el-input>
                        </el-form-item>

                        <div class="login-row">
                            <el-checkbox v-model="rememberPassword" @change="onRememberChange">记住密码</el-checkbox>
                        </div>

                        <el-form-item style="margin-bottom: 6px;">
                            <el-button class="login-btn" type="primary" @click="handleLogin" :loading="loading">登录</el-button>
                        </el-form-item>
                    </el-form>
                </div>
            </el-card>
        </div>
    </div>
</div>

<script src="../js/vue.min.js"></script>
<script src="../js/element-ui.js"></script>
<script>
    new Vue({
        el: '#app',
        data: {
            form: {
                username: '',
                password: ''
            },
            loading: false,
            theme: localStorage.getItem('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
            rememberPassword: false,
            rememberWarned: false,
            currentVersion: 'v1.4.1-beta6.4',
            hasNewVersion: false,
            releaseUrl: 'https://github.com/FQrabbit/biliupforjava/releases',
            loginError: false,
            _loginErrorTimer: null,
            _parallaxRaf: null,
            _mx: 0,
            _my: 0
        },
        mounted() {
            this.applyTheme(this.theme);
            this.loadRememberedCredentials();
            this.checkUpdate();
            this.initParallax();
        },
        methods: {
            applyTheme(theme) {
                this.theme = theme === 'dark' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', this.theme);
                try {
                    localStorage.setItem('theme', this.theme);
                } catch (e) {
                }
            },
            toggleTheme() {
                this.applyTheme(this.theme === 'dark' ? 'light' : 'dark');
            },
            goToRelease() {
                try {
                    window.open(this.releaseUrl, '_blank');
                } catch (e) {
                    window.location.href = this.releaseUrl;
                }
            },
            compareVersions(v1, v2) {
                var tokenize = function(v) {
                    return v.split(/([0-9]+)/).filter(function(s){ return s && s.length > 0; });
                };

                var parts1 = v1.split(/[-.]/);
                var parts2 = v2.split(/[-.]/);

                var len = Math.max(parts1.length, parts2.length);
                for (var i = 0; i < len; i++) {
                    var p1 = parts1[i];
                    var p2 = parts2[i];

                    if (p1 === p2) continue;
                    if (p1 === undefined) return /^\d/.test(p2) ? -1 : 1;
                    if (p2 === undefined) return /^\d/.test(p1) ? 1 : -1;

                    var t1 = tokenize(p1);
                    var t2 = tokenize(p2);

                    for (var j = 0; j < Math.max(t1.length, t2.length); j++) {
                        var sub1 = t1[j];
                        var sub2 = t2[j];

                        if (sub1 === sub2) continue;
                        if (sub1 === undefined) return -1;
                        if (sub2 === undefined) return 1;

                        var n1 = parseInt(sub1);
                        var n2 = parseInt(sub2);

                        if (!isNaN(n1) && !isNaN(n2)) {
                            if (n1 !== n2) return n1 - n2;
                        } else {
                            if (sub1 < sub2) return -1;
                            if (sub1 > sub2) return 1;
                        }
                    }
                }
                return 0;
            },
            async checkUpdate() {
                var self = this;
                var CACHE_KEY = 'biliup-update-cache';
                var CACHE_DURATION = 3600 * 1000;

                var processData = function(data) {
                    if (data && data.length > 0 && data[0].tag_name) {
                        var newVer = data[0].tag_name;
                        var v1 = self.currentVersion.replace(/^v/, '');
                        var v2 = newVer.replace(/^v/, '');
                        if (v1 !== v2 && self.compareVersions(v1, v2) < 0) {
                            self.hasNewVersion = true;
                            self.releaseUrl = data[0].html_url || self.releaseUrl;
                        }
                    }
                };

                try {
                    var cache = JSON.parse(localStorage.getItem(CACHE_KEY));
                    if (cache && (Date.now() - cache.timestamp < CACHE_DURATION)) {
                        processData(cache.data);
                        return;
                    }
                } catch (e) {}

                try {
                    var res = await fetch('https://api.github.com/repos/FQrabbit/biliupforjava/releases?per_page=1', {
                        method: 'GET',
                        headers: { 'Accept': 'application/vnd.github+json' },
                        cache: 'no-store'
                    });
                    if (!res.ok) throw new Error('bad_response');
                    var data = await res.json();
                    try {
                        localStorage.setItem(CACHE_KEY, JSON.stringify({
                            timestamp: Date.now(),
                            data: data
                        }));
                    } catch (e) {}
                    processData(data);
                } catch (e) {
                    try {
                        var cache = JSON.parse(localStorage.getItem(CACHE_KEY));
                        if (cache && cache.data) {
                            processData(cache.data);
                        }
                    } catch (err) {}
                }
            },
            loadRememberedCredentials() {
                let remember = false;
                try {
                    remember = localStorage.getItem('biliup_remember_password') === 'true';
                } catch (e) {
                }
                this.rememberPassword = remember;
                if (!remember) return;

                try {
                    this.form.username = localStorage.getItem('biliup_login_username') || '';
                    this.form.password = localStorage.getItem('biliup_login_password') || '';
                } catch (e) {
                }
            },
            onRememberChange(val) {
                const enabled = !!val;
                try {
                    localStorage.setItem('biliup_remember_password', enabled ? 'true' : 'false');
                    if (!enabled) {
                        localStorage.removeItem('biliup_login_username');
                        localStorage.removeItem('biliup_login_password');
                    } else if (!this.rememberWarned) {
                        this.rememberWarned = true;
                        this.$message.warning('注意：记住密码会保存在本机浏览器中，建议仅在个人电脑使用');
                    }
                } catch (e) {
                }
            },
            base64EncodeUnicode(str) {
                try {
                    return btoa(unescape(encodeURIComponent(str)));
                } catch (e) {
                    return btoa(str);
                }
            },
            onAnyInput() {
                if (this.loginError) {
                    this.loginError = false;
                }
            },
            triggerLoginError() {
                this.loginError = false;
                this.$nextTick(() => {
                    this.loginError = true;
                });
                if (this._loginErrorTimer) {
                    clearTimeout(this._loginErrorTimer);
                    this._loginErrorTimer = null;
                }
                this._loginErrorTimer = setTimeout(() => {
                    this.loginError = false;
                }, 750);
            },
            initParallax() {
                var reduce = false;
                try { reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
                if (reduce) return;

                var page = document.querySelector('.login-page');
                var b1 = document.querySelector('.bg-blob.blob-1');
                var b2 = document.querySelector('.bg-blob.blob-2');
                var b3 = document.querySelector('.bg-blob.blob-3');
                if (!page || !b1 || !b2 || !b3) return;

                var self = this;
                var update = function() {
                    self._parallaxRaf = null;
                    var x = self._mx;
                    var y = self._my;
                    b1.style.transform = 'translate3d(' + (x * 28) + 'px,' + (y * 20) + 'px,0)';
                    b2.style.transform = 'translate3d(' + (x * -22) + 'px,' + (y * 26) + 'px,0)';
                    b3.style.transform = 'translate3d(' + (x * 18) + 'px,' + (y * -18) + 'px,0)';
                };

                var onMove = function(ev) {
                    var vw = window.innerWidth || 1;
                    var vh = window.innerHeight || 1;
                    var cx = (ev.clientX / vw) * 2 - 1;
                    var cy = (ev.clientY / vh) * 2 - 1;
                    self._mx = Math.max(-1, Math.min(1, cx));
                    self._my = Math.max(-1, Math.min(1, cy));
                    if (self._parallaxRaf) return;
                    self._parallaxRaf = requestAnimationFrame(update);
                };

                window.addEventListener('mousemove', onMove, { passive: true });
                window.addEventListener('touchmove', function(ev) {
                    if (!ev.touches || !ev.touches[0]) return;
                    onMove(ev.touches[0]);
                }, { passive: true });
            },
            async handleLogin() {
                if (!this.form.username || !this.form.password) {
                    this.$message.warning('请输入用户名和密码');
                    return;
                }
                this.loading = true;

                const username = String(this.form.username);
                const password = String(this.form.password);
                const token = 'Basic ' + this.base64EncodeUnicode(username + ':' + password);

                try {
                    localStorage.setItem('biliup_auth', token);
                } catch (e) {
                }

                try {
                    const res = await fetch('/system-config/list', {
                        method: 'GET',
                        headers: {
                            'Authorization': token,
                            'Accept': 'application/json'
                        },
                        cache: 'no-store'
                    });

                    if (res.status === 401) {
                        throw new Error('unauthorized');
                    }
                    if (!res.ok) {
                        throw new Error('bad_response');
                    }

                    try { await res.json(); } catch (e) {}

                    if (this.rememberPassword) {
                        try {
                            localStorage.setItem('biliup_login_username', username);
                            localStorage.setItem('biliup_login_password', password);
                            localStorage.setItem('biliup_remember_password', 'true');
                        } catch (e) {
                        }
                    } else {
                        try {
                            localStorage.removeItem('biliup_login_username');
                            localStorage.removeItem('biliup_login_password');
                            localStorage.setItem('biliup_remember_password', 'false');
                        } catch (e) {
                        }
                    }

                    this.$message.success('登录成功，正在跳转...');
                    setTimeout(() => {
                        window.location.href = '../index.html';
                    }, 320);
                } catch (e) {
                    try { localStorage.removeItem('biliup_auth'); } catch (err) {}
                    if (e && e.message === 'unauthorized') {
                        this.$message.error('用户名或密码不正确');
                        this.triggerLoginError();
                    } else {
                        this.$message.error('无法连接服务，请确认程序已启动且地址正确');
                    }
                } finally {
                    this.loading = false;
                }
            }
        }
    });
</script>
</body>
</html>
